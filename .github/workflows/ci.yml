name: self-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 脚本语法检查
        run: python -m py_compile scripts/check_agreement.py scripts/export_session_text.py scripts/extract_usage_v2.py

      - name: 自检脚本命令行可用
        run: python scripts/check_agreement.py --help

      - name: Skill 本体与随附文件存在
        run: |
          test -f paper-method-fit-check/SKILL.md
          test -f paper-method-fit-check/QUICKSTART.md
          test -f QUICKSTART.md
          wc -c paper-method-fit-check/SKILL.md

      - name: Skill 文档结构自检
        run: |
          python - <<'PY'
          import pathlib, re, sys
          t = pathlib.Path('paper-method-fit-check/SKILL.md').read_text(encoding='utf-8')
          for need in ('Workflow', 'Validation', 'Failure modes'):
              if need not in t:
                  sys.exit('SKILL.md 缺少段落: ' + need)
          steps = len(re.findall(r'^### ', t, re.M))
          print('SKILL.md 段落自检通过，二级小节 %d 个' % steps)
          PY

      # 真实数据自检：两次运行的引文逐条命中原文、数值在容差内、非事实行不带引文/数值
      - name: 真实数据自检 · 第一次运行（62 条结论）
        run: |
          python scripts/check_agreement.py \
            --claims runs/C-with-1/claims.csv \
            --preconditions runs/C-with-1/preconditions.csv \
            --source paper_materials/nanochat_README_table_corrupted.md \
            --report /tmp/agreement-c1.json
          python - <<'PY'
          import json, sys
          d = json.load(open('/tmp/agreement-c1.json', encoding='utf-8'))
          print('claims_checked=%s findings_count=%s all_passed=%s' % (
              d.get('claims_checked'), d.get('findings_count'), d.get('all_passed')))
          if d.get('findings_count'):
              sys.exit('第一次运行存在 %d 项标记' % d['findings_count'])
          PY

      - name: 真实数据自检 · 严格对称复测（39 条结论）
        run: |
          python scripts/check_agreement.py \
            --claims runs/C-with-3/claims.csv \
            --preconditions runs/C-with-3/preconditions.csv \
            --source paper_materials/nanochat_README_table_corrupted.md \
            --report /tmp/agreement-c3.json
          python - <<'PY'
          import json, sys
          d = json.load(open('/tmp/agreement-c3.json', encoding='utf-8'))
          print('claims_checked=%s findings_count=%s all_passed=%s' % (
              d.get('claims_checked'), d.get('findings_count'), d.get('all_passed')))
          if d.get('findings_count'):
              sys.exit('严格对称复测存在 %d 项标记' % d['findings_count'])
          PY

      - name: 冻结哈希记录存在
        run: |
          test -f runs/C-with-3/manifest.json
          test -f cases/task-C.md
          test -f cases/acceptance-C.md
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('runs/C-with-3/manifest.json').read_text(encoding='utf-8-sig'))
          print('manifest 键：', list(m.keys())[:8])
          PY
